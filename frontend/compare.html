<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="css/global.css">
        <title>MCSR Ranked Analyzer</title>
    </head>
    <body>
        <div class="page-background"></div>
        <header class="mc-header">
            <img src="https://wallpaperaccess.com/minecraft-block" class="logo">
            <h1 class="title">MCSR Ranked Analyzer</h1>
        </header>

        <main class="content-box">
            <h2>Search Player</h2>

            <input id="p1" class="mc-input" placeholder="Player 1">
            <input id="p2" class="mc-input" placeholder="Player 2">
            <button class="mc-button" onclick="startCompare()">Compare</button>

            <div id="comparisonResults"></div>
        </main>

        <script type="module" src="js/compare.js"></script>
    </body>
</html>
